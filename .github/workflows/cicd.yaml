name: Build and push docker image

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
          role-to-assume: arn:aws:iam::410432886762:oidc-provider/token.actions.githubusercontent.com
          aws-region: us-east-1
    
        
# Login to ECR
#=============
    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Docker build 
      run: |
        docker build --build-arg REACT_APP_API_URL="http://localhost:8080" -t netflix-frontend:latest .

    - name: Docker push
      run: |
        docker tag netflix-frontend:latest 410432886762.dkr.ecr.us-east-1.amazonaws.com/netflix-frontend:${GITHUB_RUN_NUMBER}
        docker push 410432886762.dkr.ecr.us-east-1.amazonaws.com/netflix-frontend:${GITHUB_RUN_NUMBER}
